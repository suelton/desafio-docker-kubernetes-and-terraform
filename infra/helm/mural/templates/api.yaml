apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "mural.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-api }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-api }
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.api.port }} }]
          envFrom:
            - configMapRef: { name: {{ .Release.Name }}-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-db, key: DATABASE_URL } }
          # liveness = /healthz (não toca no banco); readiness = /readyz (banco + schema)
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "mural.labels" . | nindent 4 }}
spec:
  selector: { app: {{ .Release.Name }}-api }
  ports:
    - { name: http, port: 80, targetPort: http }
