{{- $pg := .Values.postgres -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels: {{- include "mural.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "postgres.password é obrigatório" $pg.password | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" $pg.user (urlquery $pg.password) (include "mural.pgHost" .) $pg.database | quote }}
